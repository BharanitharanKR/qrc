name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    name: Docs check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Required files are present
        run: |
          for f in README.md CONTRIBUTING.md LICENSE-MIT LICENSE-APACHE docs/design.md docs/phase-0.md \
                   bench/README.md driver/README.md qrcd/README.md backend/README.md tests/README.md; do
            test -s "$f" || { echo "::error file=$f::missing or empty"; exit 1; }
          done
      - name: Markdown link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --include-fragments
            --max-retries 3
            --accept 200,206,429
            --exclude '^https://discord\.gg/'
            './**/*.md'
          fail: true

  corpus:
    name: Corpus check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bench/corpus.toml is well formed and every pin resolves at its remote
        run: python3 scripts/check-corpus.py --verify-pins bench/corpus.toml

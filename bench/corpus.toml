[[workspace]]
name = "zed"
repo = "https://github.com/zed-industries/zed"
ref = "v1.25.2"
commit = "d25fa01ccd788d812f236810b71af4feff6b2e38"
date = 2026-10-21
toolchain = "1.98.1"
shape = "Very large application, many crates"
why = "Very large application workspace; the Rust project's cg_clif goal benchmarks on it, so our numbers can be compared with theirs"
manifests = 266
lock_packages = 1791
rs_files = 2007
rs_lines = 1761136
integration_tests = 22
build_scripts = 18
touch_leaf = "crates/zed/src/main.rs"
touch_core = "crates/gpui/src/gpui.rs"
system_libs = [
  "build-essential", "clang", "cmake", "curl", "elfutils", "g++", "gcc", "gettext-base", "git",
  "jq", "libasound2-dev", "libfontconfig-dev", "libgit2-dev", "libglib2.0-dev", "libsqlite3-dev",
  "libssl-dev", "libva-dev", "libvulkan1", "libwayland-dev", "libx11-xcb-dev",
  "libxkbcommon-x11-dev", "libzstd-dev", "lld", "llvm", "make", "musl-dev", "musl-tools",
  "pipewire", "xdg-desktop-portal",
]
notes = "system_libs is the base Debian/Ubuntu list from script/linux at the pinned commit. The script adds one package by release on top of it: libstdc++-14-dev on Ubuntu 24.04/24.10 and Linux Mint 22, libstdc++-12-dev on Debian 12, Ubuntu 22.04 and Linux Mint 21, and on Debian 11 / Ubuntu 20.04 clang-18, lld-18 and libstdc++-11-dev from the ubuntu-toolchain-r PPA; Debian 13 needs nothing extra. Running script/linux on the benchmark machine is the simplest way to get them. The same script lists the Fedora, Arch, openSUSE and Gentoo names. gpui is the UI framework every crate above it depends on; its library root is gpui.rs. Budget 40 GB of disk for a debug build."

# The Phase 0 benchmark corpus (docs/phase-0.md §1).
#
# Every workspace is pinned to an exact commit and toolchain so that a run on
# another machine measures the same inputs. The size facts were read from each
# repository's tree at the pinned commit on the `checked` date; the harness
# re-measures them at run time and reports both. `scripts/check-corpus.py`
# checks this file's shape and, with --verify-pins, that each `ref` still
# points at its `commit`.
#
# Fields per workspace:
#   name, repo, ref, commit, date   the pin: a release tag (or branch) and the commit it names
#   toolchain                       the stable version the workspace's rust-toolchain.toml pins,
#                                   or the stable current on `checked` when it has none
#   shape, why                      the plan's "rough shape" and "why it is in the corpus"
#   manifests                       Cargo.toml files in the tree
#   lock_packages                   [[package]] entries in Cargo.lock
#   rs_files, rs_lines              .rs files and their line count (wc -l), target/ excluded
#   integration_tests               <crate>/tests/*.rs files: an upper bound on test binaries
#                                   from integration tests, on top of one per lib and bin
#   build_scripts                   build.rs files
#   touch_leaf, touch_core          the files the touch-leaf and touch-core scenarios edit (§2)
#   system_libs                     the base list of packages a fresh Debian/Ubuntu machine needs
#                                   before cargo can build the workspace (Linux); release-specific
#                                   additions are in `notes`

schema = 1
checked = 2026-10-22

[nightly]
# The pinned nightly for `baseline-nightly` (§3): -Zself-profile and --unit-graph need it.
channel = "nightly-2026-10-15"
rustc = "rustc 1.101.0-nightly (7df81381d 2026-10-14)"

[[workspace]]
name = "loams"
repo = "https://github.com/ostrium-labs/loams"
ref = "v0.1.0"
commit = "2589d648a67b839ef3e9a786bcd6371a805fb591"
date = 2026-10-19
toolchain = "1.97.1"
shape = "Large, dependency-heavy services, many test binaries"
why = "Our own large workspace with heavy CI (about 100 manifests, about 1,400 packages in Cargo.lock, a pinned stable toolchain, around 30 GitHub Actions workflows); CI changes can be tried on it"
manifests = 101
lock_packages = 1410
rs_files = 2251
rs_lines = 968003
integration_tests = 281
build_scripts = 28
touch_leaf = "crates/loams/src/main.rs"
touch_core = "crates/loams-meta/src/lib.rs"
system_libs = ["protobuf-compiler", "build-essential"]
notes = "loams-meta is the workspace crate with the most dependents (the catalog, leases and the timestamp oracle). The first build compiles DataFusion, Lance and Tantivy: budget 30 GB of disk and keep -j at 4 on machines with less than 32 GB of RAM (its CONTRIBUTING.md)."

